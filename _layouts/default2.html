<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html', '' | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }} Feed"
    href="{{ '/feed.xml' | absolute_url }}">
  {% if site.favicon and site.favicon != "" %}
  <link rel="shortcut icon" href="{{ site.favicon | relative_url }}" type="image/png" />
  {% endif %}
  <!-- Styles -->
  <link href="https://fonts.googleapis.com/css?family=Lato:400,400i,700,700i%7CNoto+Serif:400,400i,700,700i&display=swap" rel="stylesheet">
  <link href="{{ '/assets/css/style.css' | relative_url }}" rel="stylesheet">
  <link href="{{ '/assets/css/main.css' | relative_url }}" rel="stylesheet">
  <link href="{{ '/assets/css/overrides.css' | relative_url }}?v={{ site.time | date: '%s' }}" rel="stylesheet">
  <!-- Add lightbox CSS -->
  <link href="{{ '/assets/css/lightbox.css' | relative_url }}" rel="stylesheet">
</head>
<body>
  <div class="inner">
    {% include header2.html %}
    {{content}}
  </div><!-- .inner -->
  {% include footer.html %}

  <!-- Add lightbox HTML -->
  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <img class="lightbox-content" id="lightbox-image">
  </div>

  <script src="{{ '/assets/js/plugins.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/custom.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/zoomable-plot.js' | relative_url }}"></script>
  <!-- Add lightbox JavaScript -->
  <script src="{{ '/assets/js/lightbox.js' | relative_url }}"></script>
</body>
</html>
